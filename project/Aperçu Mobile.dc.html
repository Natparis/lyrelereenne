<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=DM+Sans:opsz,wght@9..40,400..700&amp;family=JetBrains+Mono:wght@400..600&amp;display=swap" rel="stylesheet">
<style>body { margin:0; background:#efe9dc; color:#17161c; font-family:'DM Sans',sans-serif; } a { color:#17161c; } a:hover { color:#e3106e; }</style>
</helmet>
<div style="padding:48px 56px 80px; display:flex; flex-direction:column; gap:56px">
  <div>
    <div style="font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.14em; color:#e3106e; margin-bottom:10px">LA LYRE LÉRÉENNE · APERÇU MOBILE · 390 × 844</div>
    <h1 style="font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:48px; letter-spacing:-0.03em; margin:0">Toutes les pages en vue téléphone</h1>
    <p style="font-size:16px; color:#5c5a64; margin:10px 0 0; max-width:640px">Chaque écran est le vrai site, faites défiler à l'intérieur. Les espaces membres et admin s'ouvrent en mode aperçu, sans connexion.</p>
  </div>
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
    <section style="display:flex; flex-direction:column; gap:20px">
      <h2 style="font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:30px; margin:0; display:flex; gap:12px; align-items:baseline">{{ g.title }}<span style="font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:500; color:#8b8893">{{ g.count }}</span></h2>
      <div style="display:flex; flex-wrap:wrap; gap:36px 28px">
        <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4">
          <div style="display:flex; flex-direction:column; gap:10px">
            <div style="width:390px; height:844px; border:10px solid #17161c; border-radius:44px; overflow:hidden; background:#fff; box-shadow:0 18px 40px rgba(23,22,28,0.18)">
              <iframe src="{{ it.src }}" title="{{ it.label }}" loading="lazy" style="display:block; width:390px; height:844px; border:0"></iframe>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; padding:0 8px; width:390px; box-sizing:border-box">
              <span style="font-weight:700; font-size:15px">{{ it.label }}</span>
              <a href="{{ it.src }}" target="_blank" style="font-family:'JetBrains Mono',monospace; font-size:11.5px">ouvrir ↗</a>
            </div>
          </div>
        </sc-for>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const F = 'Site Lyre Lereenne.dc.html#apercu=';
    const mk = (base, list) => list.map(([k, l]) => ({ label: l, src: encodeURI(F + base + (k ? '/' + k : '')) }));
    const groups = [
      { title: 'Site public', items: mk('site', [['accueil', 'Accueil'], ['ecole', 'École & cours'], ['tarifs', 'Tarifs'], ['fiche', "Fiche d'inscription"], ['orchestre', 'Orchestre'], ['chorale', 'Chorale'], ['agenda', 'Agenda'], ['photos', 'Photos'], ['bureau', 'Le bureau'], ['contact', 'Contact']]) },
      { title: 'Connexions', items: [...mk('mlogin', [['', 'Connexion membres']]), ...mk('login', [['', 'Connexion admin']])] },
      { title: 'Espace membres', items: mk('membres', [['accueil', 'Accueil'], ['planning', 'Planning'], ['partitions', 'Partitions et audios'], ['dispos', 'Disponibilités'], ['documents', 'Documents'], ['covoit', 'Covoiturage'], ['profil', 'Mon profil'], ['cotisation', 'Ma cotisation']]) },
      { title: 'Administration', items: mk('admin', [['agenda', 'Agenda concerts'], ['actus', 'Autres actualités'], ['galerie', 'Galerie photos'], ['eleves', 'Élèves école de musique'], ['chorale', 'Élèves chorale'], ['harmonie', 'Harmonie'], ['profs', 'Professeurs'], ['instruments', "Prêt d'instruments"], ['membres', 'Membres asso'], ['espace', 'Espace membres'], ['cotisations', 'Cotisations'], ['emails', 'Écrire / Emails'], ['documents', 'Documents internes'], ['droits', 'Comptes et droits']]) },
      { title: 'Comptabilité', items: mk('admin', [['compta/chiffres', 'Chiffres clés'], ['compta/recettes', 'Recettes'], ['compta/depenses', 'Dépenses'], ['compta/caisse', 'Caisse'], ['compta/banque', 'Banque'], ['compta/avances', 'Avances membres']]) }
    ].map(g => ({ ...g, count: g.items.length + ' écrans' }));
    return { groups };
  }
}
</script>
</body>
</html>
